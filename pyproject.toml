[project]
name = "vision-model-serving"
version = "0.1.0"
description = "Reproducible single-GPU Django serving for FocalNet-DINO and MMBCD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pillow==12.3.0",
    "prometheus-client==0.22.1",
    "pydicom==3.0.2",
]

[project.optional-dependencies]
gateway = [
    "redis==5.2.1",
    "rq==2.10.0",
]
gpu = [
    "huggingface-hub==1.26.0",
    "ninja==1.13.0",
    "scipy==1.11.4",
    "timm==1.0.28",
    "tokenizers==0.22.2",
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "transformers==5.14.1",
]
web = [
    "django==5.2.16",
    "djangorestframework==3.16.1",
    "drf-spectacular==0.28.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
browser = [
    "playwright==1.62.0",
]
dev = [
    "fakeredis==2.37.0",
]

[tool.uv]
required-version = "==0.8.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_api.py" = ["E402"]
"tests/test_rq_execution_gateway.py" = ["E402"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
